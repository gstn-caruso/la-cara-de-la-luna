name: CI and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/release.py check-title --title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache pinned Godot binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-release
          key: godot-linux-${{ hashFiles('release-config.json', 'tools/install_godot.py') }}
      - run: python3 tools/install_godot.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check.py
      - name: Plan semantic release
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tools/release.py plan --github-output "$GITHUB_OUTPUT"
      - name: Export and smoke-test Linux build
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          version="${RELEASE_VERSION:-$(cat version.txt)}"
          python3 tools/build_release.py --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: |
            build/*.zip
            build/SHA256SUMS.txt
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: build
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file build/release-notes.md --draft
          fi
          gh release upload "$tag" build/*.zip build/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false
